<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 32 32">
  <!-- Silver chrome grab cursor: soft shadow, dark rounded edge, banded chrome fill.
       Generated together so all three cursors share one look. -->
  <defs>
    <linearGradient id="grab-chrome" gradientUnits="userSpaceOnUse" x1="5" y1="2" x2="21" y2="30"><stop offset="0" stop-color="#f7f7fa"/><stop offset="0.16" stop-color="#a6a6ae"/><stop offset="0.3" stop-color="#f3f3f6"/><stop offset="0.44" stop-color="#8a8a93"/><stop offset="0.52" stop-color="#2c2c32"/><stop offset="0.58" stop-color="#6e6e77"/><stop offset="0.72" stop-color="#d6d6dc"/><stop offset="0.84" stop-color="#f7f7fa"/><stop offset="1" stop-color="#92929a"/></linearGradient>
    <linearGradient id="grab-rim" gradientUnits="userSpaceOnUse" x1="4" y1="2" x2="18" y2="28">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#4a4a52"/>
    </linearGradient>
    <g id="grab-shape">
      <rect x="8.4" y="9.4" width="3.6" height="7" rx="1.8"/>
      <rect x="12.6" y="8.2" width="3.6" height="7.6" rx="1.8"/>
      <rect x="16.8" y="8.4" width="3.6" height="7.4" rx="1.8"/>
      <rect x="21" y="9.8" width="3.2" height="6.6" rx="1.6"/>
      <rect x="8.4" y="12.8" width="15.8" height="13.4" rx="5.6"/>
      <rect x="6.4" y="14.4" width="3.8" height="8" rx="1.9" transform="rotate(-22 8.3 21)"/>
    </g>
  </defs>
  <use href="#grab-shape" transform="translate(0.45 0.65)" fill="#000" fill-opacity="0.18" stroke="#000" stroke-opacity="0.18" stroke-width="1.6" stroke-linejoin="round"/>
  <use href="#grab-shape" fill="#26262c" stroke="#26262c" stroke-width="2" stroke-linejoin="round"/>
  <use href="#grab-shape" fill="url(#grab-chrome)"/>
</svg>
