<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 32 32">
  <!-- Silver chrome point cursor: soft shadow, dark rounded edge, banded chrome fill.
       Generated together so all three cursors share one look. -->
  <defs>
    <linearGradient id="point-chrome" gradientUnits="userSpaceOnUse" x1="5" y1="2" x2="21" y2="30"><stop offset="0" stop-color="#f7f7fa"/><stop offset="0.16" stop-color="#a6a6ae"/><stop offset="0.3" stop-color="#f3f3f6"/><stop offset="0.44" stop-color="#8a8a93"/><stop offset="0.52" stop-color="#2c2c32"/><stop offset="0.58" stop-color="#6e6e77"/><stop offset="0.72" stop-color="#d6d6dc"/><stop offset="0.84" stop-color="#f7f7fa"/><stop offset="1" stop-color="#92929a"/></linearGradient>
    <linearGradient id="point-rim" gradientUnits="userSpaceOnUse" x1="4" y1="2" x2="18" y2="28">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#4a4a52"/>
    </linearGradient>
    <g id="point-shape">
      <rect x="10.4" y="1.4" width="3.8" height="16.5" rx="1.9"/>
      <rect x="14.8" y="11.2" width="3.5" height="8.5" rx="1.75"/>
      <rect x="18.9" y="12.4" width="3.5" height="8" rx="1.75"/>
      <rect x="23" y="14" width="3.1" height="7" rx="1.55"/>
      <rect x="10.4" y="15.6" width="15.7" height="12" rx="5.2"/>
      <rect x="7.4" y="15.4" width="3.6" height="9.4" rx="1.8" transform="rotate(-32 9.2 24)"/>
    </g>
  </defs>
  <use href="#point-shape" transform="translate(0.45 0.65)" fill="#000" fill-opacity="0.18" stroke="#000" stroke-opacity="0.18" stroke-width="1.6" stroke-linejoin="round"/>
  <use href="#point-shape" fill="#26262c" stroke="#26262c" stroke-width="2" stroke-linejoin="round"/>
  <use href="#point-shape" fill="url(#point-chrome)"/>
</svg>
